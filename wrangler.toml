# Skopaq MCP Server - Model Context Protocol for AI IDEs
# https://skopaq.ai
#
# This MCP server allows AI coding assistants (Claude Code, Cursor, Windsurf)
# to interact with Skopaq E2E testing capabilities directly.
#
# Deploy with: npm run deploy

name = "argus-mcp"
main = "src/index.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2025-09-17"

# Enable observability for debugging
[observability]
enabled = true

# Workers AI binding for free-tier AI
[ai]
binding = "AI"

# Environment variables
[vars]
ENVIRONMENT = "production"
# Browser Pool URL - Primary browser automation (Vultr VKE cluster - Mumbai)
# Deployed via: ./browser-pool/deploy-vultr.sh
# Note: Using nip.io domain because Cloudflare Workers can't fetch raw IPs (error 1003)
BROWSER_POOL_URL = "http://65.20.72.251.nip.io"
# Worker URL - Fallback browser automation (Cloudflare Browser Rendering)
ARGUS_API_URL = "https://skopaq-api.samuelvinay-kumar.workers.dev"
# Brain URL - Intelligence (test planning, quality, webhooks)
ARGUS_BRAIN_URL = "https://skopaq-brain-production.up.railway.app"

# Secrets (set via `wrangler secret put <NAME>`):
# - API_TOKEN (for authenticating with Skopaq API)
# - BROWSER_POOL_JWT_SECRET (production - JWT signing for browser pool)
# - BROWSER_POOL_API_KEY (deprecated - legacy API key, use JWT instead)
# - ANTHROPIC_API_KEY (optional, for enhanced AI analysis)
# - SENTRY_DSN (for error monitoring)

# ============================================================================
# R2 Storage - Object storage for screenshots and artifacts
# Uses same bucket as argus-api for unified storage
# ============================================================================
[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "argus-artifacts"

# R2 key patterns:
# - mcp-screenshots/{session_id}/{step_index}.png
# - mcp-screenshots/{session_id}/final.png

# KV namespace for auth state persistence
[[kv_namespaces]]
binding = "AUTH_STATE"
id = "3a08b855994d4b3e99a14062744109e8"

# Durable Objects for OAuth state management
[[durable_objects.bindings]]
name = "MCP_OAUTH"
class_name = "MCPOAuth"

# Durable Object for MCP Agent (manages per-connection state with SQLite)
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "SkopaqMcpAgentSQLite"

[[migrations]]
tag = "v1"
new_classes = ["MCPOAuth"]

[[migrations]]
tag = "v2"

[[migrations]]
tag = "v3"

[[migrations]]
tag = "v4"

[[migrations]]
tag = "v5"
deleted_classes = ["SkopaqMcpAgentDO"]

[[migrations]]
tag = "v6"
deleted_classes = ["SkopaqMcpAgent"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["SkopaqMcpAgentSQLite"]
